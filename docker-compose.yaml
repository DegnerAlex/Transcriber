services:
  frontend:
    working_dir: /srv/
    restart: "no"
    build:
      context: ./
      dockerfile: docker/frontend/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        USER: ${USER:-developer}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./translator/:/srv:cached
    ports:
      - "9999:9999"
    command: sh -c "npm run dev"
    network_mode: host

  translator:
    restart: "no"
    build:
      context: ./
      dockerfile: docker/translator/Dockerfile
    environment:
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      # PipeWire client looks for its socket in $XDG_RUNTIME_DIR/pipewire-0
      - PIPEWIRE_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - RUST_BACKTRACE=full
      - DISPLAY=${DISPLAY}
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
      - WEBKIT_DEBUG=1
      - CI=true
      # whisper.cpp ggml model for the transcription engine
      - WHISPER_MODEL_PATH=/srv/src-tauri/models/ggml-medium-q5_0.bin
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # linuxdeploy (AppImage bundler) is itself an AppImage and cannot mount
      # squashfs inside the container without FUSE.
      - APPIMAGE_EXTRACT_AND_RUN=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Hot-plug friendly ALSA access: a plain bind mount shows devices plugged
    # in after container start, and the cgroup rule allows every node with
    # the ALSA major (116), not just the ones present at creation time.
    device_cgroup_rules:
      - "c 116:* rwm"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /dev/snd:/dev/snd
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pipewire-0:${XDG_RUNTIME_DIR:-/run/user/1000}/pipewire-0
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
#      - ./src-tauri/Exergame:/srv:cached
      - ./translator/:/srv:cached
      - ~/.local/share/:/root/.local/share/
      # Persistent cargo registry: gen/android references crates by absolute
      # registry paths, which must survive across `docker compose run` sessions.
      - cargo-registry:/root/.cargo/registry
    devices:
      - /dev/fuse:/dev/fuse

    working_dir: /srv
    command: cargo tauri dev
    network_mode: host
    stdin_open: true
    tty: true
    depends_on:
      - frontend

# Persisted cargo registry shared by exergame containers
volumes:
  cargo-registry:
