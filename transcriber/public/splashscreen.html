<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Transcriber</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #f5f5f5;
                color: #363636;
                font-family: system-ui, sans-serif;
                user-select: none;
                cursor: default;
            }

            .splash {
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1rem;
            }

            .splash h1 {
                margin: 0;
                font-size: 1.35rem;
                font-weight: 600;
                letter-spacing: 0.04em;
            }

            .spinner {
                width: 26px;
                height: 26px;
                border: 3px solid rgba(0, 0, 0, 0.1);
                border-top-color: #4caf50;
                border-radius: 50%;
                animation: spin 0.9s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="splash">
            <h1>Transcriber</h1>
            <div class="spinner"></div>
        </div>
    </body>
</html>
