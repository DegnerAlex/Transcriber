<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Градиент центрального поля (сине-голубой с мягким фиолетовым переходом, как в референсе) -->
    <linearGradient id="coreBlueGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#28A9E5" />
      <stop offset="55%" stop-color="#32B2EC" />
      <stop offset="100%" stop-color="#8B6EE4" />
    </linearGradient>

    <!-- Градиент верхней/нижней фиолетовых лент-капсул -->
    <linearGradient id="purpleRibbonDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A37C7" />
      <stop offset="50%" stop-color="#9B46DA" />
      <stop offset="100%" stop-color="#8A37C7" />
    </linearGradient>

    <!-- Градиент боковых фиолетовых дуг наушников (светлый оттенок с объёмом) -->
    <linearGradient id="purpleRibbonLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C167F7" />
      <stop offset="100%" stop-color="#A84BE3" />
    </linearGradient>

    <!-- Градиент белых/светлых элементов интерфейса -->
    <linearGradient id="whiteGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6F7FF" />
    </linearGradient>

    <!-- Тень на стыке объёмных лент -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#3B0F63" flood-opacity="0.4" />
    </filter>

    <!-- Мягкая тень для внутренних элементов -->
    <filter id="innerElementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1A3A6E" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- 1. Симметричная центральная основа (скруглённый квадрат — экран/область обработки) -->
  <rect x="46" y="42" width="164" height="164" rx="34" fill="url(#coreBlueGrad)" />
  <rect x="46" y="42" width="164" height="164" rx="34" fill="none" stroke="#1E4B8F" stroke-width="4" opacity="0.16" />

  <!-- 2. Симметричная фиолетовая лента-оголовье сверху (символ прослушивания / аудиовхода) -->
  <path d="M 46,96 V 76 C 46,42 74,20 128,20 C 182,20 210,42 210,76 V 96 H 192 V 76 C 192,52 170,38 128,38 C 86,38 64,52 64,76 V 96 Z" fill="url(#purpleRibbonDark)" />

  <!-- 3. Симметричные левый и правый амбушюры (аудиоканалы L / R) в стиле объёмных скруглённых лент референса -->
  <!-- Левый наушник -->
  <rect x="24" y="84" width="26" height="64" rx="13" fill="url(#purpleRibbonLight)" filter="url(#ribbonShadow)" />
  <!-- Правый наушник -->
  <rect x="206" y="84" width="26" height="64" rx="13" fill="url(#purpleRibbonLight)" filter="url(#ribbonShadow)" />

  <!-- 4. Симметричная нижняя лента-капсула (строка готового текста / субтитров) -->
  <rect x="46" y="186" width="164" height="44" rx="14" fill="url(#purpleRibbonDark)" filter="url(#ribbonShadow)" />
  <!-- Симметричные строки транскрибированного текста внутри нижней ленты -->
  <rect x="70" y="199" width="116" height="6" rx="3" fill="#FFFFFF" opacity="0.92" />
  <rect x="88" y="211" width="80" height="6" rx="3" fill="#E2B8FF" opacity="0.85" />

  <!-- 5. Симметричная звуковая волна в центре (входящий голос) -->
  <g fill="url(#whiteGlowGrad)" filter="url(#innerElementShadow)">
    <!-- Крайние полосы -->
    <rect x="74" y="103" width="10" height="24" rx="5" />
    <rect x="172" y="103" width="10" height="24" rx="5" />

    <!-- Средние полосы -->
    <rect x="93" y="89" width="10" height="52" rx="5" />
    <rect x="153" y="89" width="10" height="52" rx="5" />

    <!-- Внутренние полосы -->
    <rect x="112" y="96" width="10" height="38" rx="5" />
    <rect x="134" y="96" width="10" height="38" rx="5" />

    <!-- Центральный пик голоса -->
    <rect x="123" y="79" width="10" height="72" rx="5" />
  </g>

  <!-- 6. Симметричный индикатор преобразования речи в текст (стрелка вниз от волны к текстовому блоку) -->
  <path d="M 118,162 L 128,172 L 138,162" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
</svg>